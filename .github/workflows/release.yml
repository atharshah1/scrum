name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
  push:
    tags:
      - "v*"

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/amd64, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build
      env:
        CLIENT_ID: ${{ secrets.SCRUM_JIRA_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.SCRUM_JIRA_CLIENT_SECRET }}
      run: |
        mkdir -p dist
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-X 'github.com/atharshah1/scrum/internal/auth.embeddedClientID=$CLIENT_ID' -X 'github.com/atharshah1/scrum/internal/auth.embeddedClientSecret=$CLIENT_SECRET'" -o dist/scrum-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} main.go

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        files: dist/*
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        body_path: INSTALL.md
